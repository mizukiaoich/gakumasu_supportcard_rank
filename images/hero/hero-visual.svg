<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="装飾用のオリジナル背景ビジュアル">
  <!-- オリジナルの装飾ビジュアル（プレースホルダー）。差し替える場合は同名ファイルを置き換えてください。 -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfeafe"/><stop offset="1" stop-color="#f1e9ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fa2"/><stop offset="0.5" stop-color="#8e6cf0"/><stop offset="1" stop-color="#2f7df6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <symbol id="star" viewBox="-10 -10 20 20"><path d="M0-10 2.4-2.4 10 0 2.4 2.4 0 10-2.4 2.4-10 0-2.4-2.4Z"/></symbol>
  </defs>
  <circle cx="300" cy="200" r="190" fill="url(#g1)"/>
  <circle cx="300" cy="200" r="150" fill="none" stroke="url(#g2)" stroke-width="2" stroke-dasharray="4 10" opacity="0.6"/>
  <circle cx="230" cy="130" r="90" fill="url(#glow)"/>
  <path d="M60 330 C160 250 260 380 380 300 S520 260 540 230" fill="none" stroke="url(#g2)" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <g opacity="0.9">
    <rect x="360" y="40" width="120" height="160" rx="18" fill="#fff" stroke="#d6e6f5" stroke-width="2" transform="rotate(10 420 120)"/>
    <rect x="378" y="58" width="84" height="84" rx="12" fill="#ffe6f0" transform="rotate(10 420 120)"/>
    <rect x="96" y="60" width="104" height="140" rx="16" fill="#fff" stroke="#d6e6f5" stroke-width="2" transform="rotate(-12 148 130)"/>
    <rect x="112" y="76" width="72" height="72" rx="10" fill="#e3edff" transform="rotate(-12 148 130)"/>
  </g>
  <g fill="#ffc83d"><use href="#star" x="470" y="10" width="34" height="34"/><use href="#star" x="60" y="240" width="22" height="22"/></g>
  <g fill="#ff5fa2"><use href="#star" x="250" y="20" width="20" height="20"/><use href="#star" x="510" y="260" width="18" height="18"/></g>
  <g fill="#8e6cf0"><use href="#star" x="40" y="40" width="16" height="16"/></g>
  <g fill="#2f7df6"><use href="#star" x="330" y="390" width="16" height="16"/></g>
</svg>
